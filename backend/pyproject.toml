[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fortnite-ia-backend"
version = "0.1.0"
description = "Backend local para inferencia multimodal en tiempo real de Fortnite IA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "tabulate>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
